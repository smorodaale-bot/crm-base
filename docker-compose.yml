services:
  db:
    image: postgres:16-alpine
    container_name: crm-base-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_base
    ports:
      - "5432:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data

volumes:
  crm_pg_data:
